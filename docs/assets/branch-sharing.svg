<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title description">
  <title id="title">Full-snapshot duplication compared with Tulya structural sharing</title>
  <desc id="description">An illustrative 800-message checkpoint forks into retries with three and four new messages. Full snapshots repeat the 800-message prefix three times. Tulya represents the prefix once and attaches the two divergent additions while retaining three exact checkpoints.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop class="canvas-start" offset="0" />
      <stop class="canvas-end" offset="1" />
    </linearGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166" />
      <stop offset="0.48" stop-color="#ff9f1c" />
      <stop offset="1" stop-color="#f25c05" />
    </linearGradient>
    <linearGradient id="saffron-soft" x1="0" y1="0" x2="1" y2="1">
      <stop class="soft-start" offset="0" />
      <stop class="soft-end" offset="1" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#9a4300" flood-opacity="0.18" />
    </filter>
  </defs>
  <style>
    .background { fill: url(#canvas); }
    .canvas-start { stop-color: #ffffff; }
    .canvas-end { stop-color: #fff8ed; }
    .soft-start { stop-color: #fff5d6; }
    .soft-end { stop-color: #ffe0ae; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
    .title { font-size: 22px; font-weight: 600; }
    .heading { font-size: 17px; font-weight: 600; }
    .label { font-size: 14px; font-weight: 600; }
    .note { font-size: 13px; fill: #59636e; }
    .brand-text { fill: #2b1800; }
    .prefix { fill: url(#saffron-soft); stroke: #e76f00; stroke-width: 1.5; }
    .addition { fill: url(#saffron); stroke: #c94f00; stroke-width: 1.5; }
    .shared { filter: url(#soft-shadow); }
    .checkpoint { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .guide { fill: none; stroke: #8c959f; stroke-width: 2; }
    .divider { stroke: #d0d7de; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .canvas-start { stop-color: #0d1117; }
      .canvas-end { stop-color: #21150d; }
      .soft-start { stop-color: #4a2b0a; }
      .soft-end { stop-color: #713c08; }
      text { fill: #f0f6fc; }
      .note { fill: #9da7b3; }
      .brand-text { fill: #2b1800; }
      .prefix { stroke: #ffb23f; }
      .addition { stroke: #ffc15a; }
      .checkpoint { fill: #161b22; stroke: #6e7681; }
      .guide { stroke: #6e7681; }
      .divider { stroke: #30363d; }
    }
  </style>

  <rect class="background" width="1040" height="470" rx="12" />

  <text class="title" x="520" y="30" text-anchor="middle">Best-fit shape: append, then fork</text>
  <text class="note" x="520" y="54" text-anchor="middle">Illustrative pattern—not the benchmark corpus</text>
  <line class="divider" x1="520" y1="78" x2="520" y2="445" />

  <text class="heading" x="260" y="96" text-anchor="middle">Repeated full snapshots</text>

  <rect class="prefix" x="54" y="122" width="405" height="58" rx="8" />
  <text class="label" x="256" y="147" text-anchor="middle">checkpoint 0</text>
  <text class="note" x="256" y="168" text-anchor="middle">800-message prefix</text>

  <rect class="prefix" x="54" y="220" width="392" height="58" rx="8" />
  <rect class="addition" x="446" y="220" width="13" height="58" rx="5" />
  <text class="label" x="250" y="245" text-anchor="middle">retry A copies the same 800</text>
  <text class="note" x="250" y="266" text-anchor="middle">then adds 3 messages</text>

  <rect class="prefix" x="54" y="318" width="390" height="58" rx="8" />
  <rect class="addition" x="444" y="318" width="15" height="58" rx="5" />
  <text class="label" x="250" y="343" text-anchor="middle">retry B copies the same 800</text>
  <text class="note" x="250" y="364" text-anchor="middle">then adds 4 messages</text>

  <text class="label" x="260" y="417" text-anchor="middle">2,407 logical message-values across three snapshots</text>
  <text class="note" x="260" y="439" text-anchor="middle">The unchanged prefix is represented three times.</text>

  <text class="heading" x="780" y="96" text-anchor="middle">Tulya structural sharing</text>

  <rect class="prefix shared" x="650" y="132" width="260" height="78" rx="10" />
  <text class="label" x="780" y="163" text-anchor="middle">shared 800-message prefix</text>
  <text class="note" x="780" y="187" text-anchor="middle">represented once</text>

  <path class="guide" d="M780 210 V255 M780 255 H650 V305 M780 255 H910 V305" />

  <rect class="addition shared" x="575" y="305" width="150" height="68" rx="9" />
  <text class="label brand-text" x="650" y="334" text-anchor="middle">retry A</text>
  <text class="note brand-text" x="650" y="356" text-anchor="middle">+3 messages</text>

  <rect class="addition shared" x="835" y="305" width="150" height="68" rx="9" />
  <text class="label brand-text" x="910" y="334" text-anchor="middle">retry B</text>
  <text class="note brand-text" x="910" y="356" text-anchor="middle">+4 messages</text>

  <text class="label" x="780" y="417" text-anchor="middle">800 shared + 3 divergent + 4 divergent</text>
  <text class="note" x="780" y="439" text-anchor="middle">All three checkpoints remain exactly reconstructable.</text>
</svg>

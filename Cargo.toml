[package]
name = "tulya-checkpoint-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Durable branch-aware checkpoint store for append-only agent state"
license = "MIT"
repository = "https://github.com/Vedsaga/tulya-checkpoint-store"
keywords = ["agents", "checkpoint", "dag", "storage"]
categories = ["data-structures", "database-implementations"]

[workspace]
members = ["."]
resolver = "2"

[lib]
name = "tulya_checkpoint_store"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
fs4 = "0.8.4"
getrandom = "0.3.4"
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tulya-checkpoint"
path = "src/bin/tulya_checkpoint.rs"

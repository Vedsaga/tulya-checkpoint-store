name: Independent reproduction
description: Report a packaged smoke, public evaluation, or authorized one-shot holdout result.
title: "[reproduction] "
body:
  - type: markdown
    attributes:
      value: |
        Preserve failures and limitations unchanged. Never run the reserved holdout without prior authorization, and never paste private corpus contents or credentials into this issue.

  - type: dropdown
    id: evaluation_type
    attributes:
      label: Evaluation type
      options:
        - Unpacked-crate smoke
        - Pinned public evaluation partition
        - Authorized one-shot reserved holdout
        - External workload
    validations:
      required: true

  - type: input
    id: evaluator
    attributes:
      label: Evaluator
      description: Name, handle, organization, or stable anonymized identifier.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Exact Tulya commit
      placeholder: 40-character Git commit
    validations:
      required: true

  - type: input
    id: artifact_hash
    attributes:
      label: Crate or source-tree SHA-256
    validations:
      required: true

  - type: input
    id: corpus_hash
    attributes:
      label: Corpus SHA-256
      description: Provide only the digest, not private corpus content.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Independent environment
      description: OS/kernel, CPU, RAM, filesystem/mount options, Python/Rust versions, and whether this is a separate machine.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true

  - type: input
    id: summary_hash
    attributes:
      label: Raw summary SHA-256
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Exactness and measurement outcome
      description: Include checkpoint/reference counts, failures, retained bytes, latency protocol, RSS, wall time, and whether every backend reopened exactly.
    validations:
      required: true

  - type: textarea
    id: losses
    attributes:
      label: Tulya losses and comparator wins
      description: Report these explicitly; a result omitting losses is incomplete.
    validations:
      required: true

  - type: checkboxes
    id: integrity
    attributes:
      label: Evidence integrity
      options:
        - label: I did not tune the candidate or thresholds after observing this result.
          required: true
        - label: I preserved failures and comparator wins unchanged.
          required: true
        - label: Any holdout access was explicitly authorized and occurred once.
          required: false

  - type: dropdown
    id: quotation
    attributes:
      label: May the maintainers request an exact, scoped technical quote?
      options:
        - Yes
        - No
    validations:
      required: true

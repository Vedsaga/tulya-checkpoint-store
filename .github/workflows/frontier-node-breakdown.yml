name: frontier-node-breakdown

on:
  push:
    branches:
      - feat/frontier-flip-zero-copy

permissions:
  contents: write

jobs:
  instrument:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.80'
          components: rustfmt, clippy
      - name: Apply exact node instrumentation
        run: python3 tools/apply_frontier_node_breakdown.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy benchmark target
        run: cargo clippy --example frontier_flip_tulya --locked -- -D warnings
      - name: Python syntax
        run: python3 -m py_compile benchmarks/frontier_flip/run.py
      - name: Run quick frontier node breakdown
        run: |
          python3 benchmarks/frontier_flip/run.py --profile quick --output-dir /tmp/frontier-node-breakdown
          python3 - <<'PY'
          import json
          p='/tmp/frontier-node-breakdown/summary.json'
          d=json.load(open(p))
          for case in d['results']:
              t=case['manifest']['topology']
              n=case['tulya']['node_allocation']
              print(t, json.dumps(n, sort_keys=True))
          PY
      - name: Commit validated instrumentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/frontier_flip_tulya.rs
          git commit -m "bench: report persistent node allocation per update"
          git push origin HEAD:feat/frontier-flip-zero-copy

name: apply-zero-copy

on:
  push:
    branches:
      - feat/frontier-flip-zero-copy
    paths:
      - .github/workflows/apply-zero-copy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.80'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact zero-copy source updates
        run: |
          python3 tools/apply_frontier_zero_copy.py
          python3 tools/apply_frontier_zero_copy_followup.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features local-server --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets --features local-server --locked -- --test-threads=1
      - name: Frontier quick benchmark
        run: |
          python3 benchmarks/frontier_flip/run.py --profile quick --output-dir /tmp/tulya-frontier-flip-zero-copy
          cat /tmp/tulya-frontier-flip-zero-copy/summary.json
      - name: Commit validated core change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tulya-core/src/persistent_sequence/avl.rs \
                  crates/tulya-core/src/persistent_sequence/physical.rs \
                  crates/tulya-core/src/persistent_sequence/compaction_v2.rs \
                  crates/tulya-core/src/persistent_history/authority.rs
          git commit -m "fix: share immutable payload ranges across persistent leaf splits"
          git push origin HEAD:feat/frontier-flip-zero-copy

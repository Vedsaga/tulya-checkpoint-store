name: orchard-prefix-scout
on:
  push:
    branches: [feat/frontier-flip-zero-copy]
    paths:
      - 'benchmarks/real_agent_trace/scout_orchard_prefix.py'
      - '.github/workflows/orchard-prefix-scout.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile benchmarks/real_agent_trace/scout_orchard_prefix.py
      - name: Live Orchard scout
        run: |
          python3 benchmarks/real_agent_trace/scout_orchard_prefix.py \
            --output-dir /tmp/orchard-prefix \
            --target-instances 8 \
            --page-length 20 \
            --max-rows 500
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/orchard-prefix/summary.json'))
          assert d['instances_analyzed'] >= 8, d
          print(json.dumps({
            'rows_fetched': d['rows_fetched'],
            'unique_instances_seen': d['unique_instances_seen'],
            'instances_with_multiple_rollouts_seen': d['instances_with_multiple_rollouts_seen'],
            'instances_analyzed': d['instances_analyzed'],
            'aggregate': d['aggregate'],
          }, sort_keys=True))
          print(json.dumps(d['instances'], sort_keys=True))
          PY

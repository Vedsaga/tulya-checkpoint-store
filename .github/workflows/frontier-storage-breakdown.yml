name: frontier-storage-breakdown

on:
  push:
    branches:
      - feat/frontier-flip-zero-copy
    paths:
      - .github/workflows/frontier-storage-breakdown.yml

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.80'
          components: rustfmt, clippy
      - name: Apply exact instrumentation update
        run: python3 tools/apply_frontier_storage_breakdown.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy benchmark target
        run: cargo clippy --example frontier_flip_tulya --locked -- -D warnings
      - name: Python syntax
        run: python3 -m py_compile benchmarks/frontier_flip/run.py
      - name: Run quick frontier decomposition
        run: |
          python3 benchmarks/frontier_flip/run.py --profile quick --output-dir /tmp/frontier-storage-breakdown
          cat /tmp/frontier-storage-breakdown/summary.json
      - name: Commit validated instrumentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/frontier_flip_tulya.rs benchmarks/frontier_flip/run.py
          git commit -m "bench: report exact frontier storage decomposition"
          git push origin HEAD:feat/frontier-flip-zero-copy

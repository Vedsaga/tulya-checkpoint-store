services:
  postgres:
    image: postgres:17.10-bookworm
    container_name: tulya-agent-bench-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 60
    # Keep PostgreSQL defaults. The benchmark is not allowed to tune shared
    # buffers, WAL, synchronous_commit, fsync, or other settings in either
    # direction. The runner records SHOW server_version and SHOW settings.
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
